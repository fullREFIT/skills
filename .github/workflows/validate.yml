name: Validate public skills

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            presentation-deck-builder-skill/package-lock.json
            presentation-deck-builder-skill/skill/presentation-deck-builder-v2/assets/renderer/package-lock.json

      - name: Validate repository structure
        run: python3 scripts/validate-repository.py

      - name: Install landing-page dependencies
        run: npm ci --prefix presentation-deck-builder-skill

      - name: Install renderer dependencies
        run: npm ci --prefix presentation-deck-builder-skill/skill/presentation-deck-builder-v2/assets/renderer

      - name: Run full release gate
        run: npm run check
